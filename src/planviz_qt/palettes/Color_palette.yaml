# PlanViz color palette. Keep hexadecimal colors quoted.
# Shapes are fixed: agent = circle, errand = diamond, final task = square.
version: 1

agent:
  # Normal status, including moving agents without a special recorded status.
  idle: "#00bfff"
  newly_assigned: "#9acd32"
  delayed: "#ffff00"
  errand_completed: "#32cd32"
  collision: "#ff0000"
  heading: "#000080"
  index: "#101827"
  selected_outline: "#ef4444"
  collision_outline: "#dc2626"
  start_fill: "#919baa"
  start_outline: "#7b8491"

task:
  unassigned: "#eeeaa2"
  newly_assigned: "#9acd32"
  assigned: "#ffa500"
  completed: "#c0c0c0"
  index: "#343b46"

errand:
  unassigned: "#ddd6fe"
  newly_assigned: "#9acd32"
  assigned: "#a78bfa"
  completed: "#c0c0c0"
  index: "#343b46"

path:
  executed: "#803bba"
  remaining_errands: "#4eb1a6"
