[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planviz-qt"
version = "0.1.0"
description = "A PySide6 desktop inspector for multi-agent plans and execution logs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PySide6>=6.8,<7", "numpy>=2,<3", "matplotlib>=3.9,<4", "PyYAML>=6,<7"]

[project.scripts]
planviz-qt = "planviz_qt.__main__:main"
planviz-convert = "planviz_qt.converters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"planviz_qt.converters" = ["README.md", "FORMAT.md"]
"planviz_qt.palettes" = ["*.yaml"]
